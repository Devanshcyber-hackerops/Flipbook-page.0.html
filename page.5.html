<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Devansh Kamble">
    <meta name="description" content="This is the page about my personal info">
    <link rel="icon" href="Flipbook F Logo on White.png"
      type="image/x-icon">
      <style>
:root {
    --paper: #E8D8B5;
    --brown: #654321;
    --burgundy: #702C3B;
    --green: #354B35;
    --gold: #B08D57;
    --ink: #29251F;
    --paper-light: #F3EAD3;
    --paper-dark: #DEC99E;
    --shadow: rgba(41, 37, 31, 0.28);
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* PAGE BACKGROUND */
body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);

    font-family: Georgia, 'Times New Roman', serif;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

/* MAIN HEADING */
h2 {
    font-family: system-ui, sans-serif;
    font-size: clamp(22px, 3vw, 30px);
    color: var(--burgundy);

    background: var(--paper-light);
    border: 3px solid var(--gold);
    border-bottom: 5px solid var(--burgundy);

    padding: 16px 35px;
    margin-bottom: 35px;

    text-align: center;

    box-shadow:
        5px 5px 0 var(--brown),
        8px 9px 15px var(--shadow);
}

/* QR CODE IMAGES */
img {
    width: 210px;
    height: 210px;
    object-fit: contain;

    background: #FFFFFF;

    padding: 12px;
    margin: 15px;

    border: 3px solid var(--gold);
    outline: 2px solid var(--brown);
    outline-offset: 5px;

    box-shadow:
        7px 7px 0 var(--brown),
        10px 12px 18px var(--shadow);

    transition: transform 0.3s ease,
                box-shadow 0.3s ease;
}

/* HOVER EFFECT */
img:hover {
    transform: translateY(-5px) scale(1.02);

    box-shadow:
        9px 9px 0 var(--burgundy),
        12px 15px 20px var(--shadow);
}

/* RESPONSIVE DESIGN */
@media (max-width: 600px) {

    body {
        padding: 20px;
    }

    h2 {
        font-size: 21px;
        padding: 13px 18px;
        margin-bottom: 25px;
    }

    img {
        width: 180px;
        height: 180px;
        margin: 14px;
    }
}
</style>
</head>
<body>
    <h2>For More Information (Scan it)</h2>
  <img src="qr.png" alt="Logo" id="logo">
  <img src="qrcode_434187131_dcc8cb32797c75f9c7ac31182dcbc007.png" alt="Logo" id="logo">  
</body>
</html>
